tool_inventory_note: >
  The list above is the subset of the 100+ published tools that Reprise names explicitly in its
  own Agent Skills and help-center articles. It is not the complete tools/list manifest — that
  requires an authenticated OAuth introspection against app.getreprise.com. Reprise states new
  tools ship on a near-weekly cadence and recommends asking the connected assistant
  "what can the Reprise MCP do?" for the current list.

clients:
  - name: Claude
    method: connector directory (Settings → Connectors → Reprise)
    note: Team/Enterprise workspace Owners may need to enable the connector once
  - name: ChatGPT
    method: Developer Mode custom connector, OAuth
    note: Plus/Pro get read-only tools; Business/Enterprise/Edu get read-write behind an admin toggle
  - name: Microsoft Copilot
    method: Copilot Studio → Tools → Add a tool → Model Context Protocol
    note: OAuth 2.0 with Dynamic Client Registration
  - name: Gemini
  - name: Codex
  - name: Cursor

governance:
  permissions: >
    Every action runs as the authenticated user. MCP tools cannot exceed the user's existing
    Reprise role — custom roles, builder/presenter restrictions, group sharing and folder access
    all apply. No separate MCP license is required.
  tenant_isolation: MCP scope check, request-context client binding, ORM client= filter on every backend query
  prompt_injection: >
    Tool fields carrying user-captured content (html_screen, html_guide, clone_request,
    clone_snippet, clone_note) are wrapped in <untrusted-content>...</untrusted-content>
    delimiters with a data-not-instructions disclaimer.
  audit_log: >
    State-changing MCP tool calls append to the customer-visible ClientAuditLog, stamped with
    mcp_request_id, mcp_client_id and mcp_token_id.
  rollback: Product Tours carry version history; dataset version history is internal-only

skills:
  published_by_provider: true
  repo: https://github.com/GetReprise/reprise-skills
