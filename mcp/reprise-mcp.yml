deployment:
  mode: remote
  endpoint: https://app.getreprise.com/mcp/
  auth: oauth
  verified: probed

server:
  name: reprise
  transport: http
  url: https://app.getreprise.com/mcp/
  surface_version: v2
  tool_count_published: "100+"
  notes: >
    Reprise announced GA of the Reprise MCP server on 2026-06-16. It is hosted by Reprise on the
    same infrastructure as the rest of the platform — the documented egress requirement is a
    single host, app.getreprise.com:443 over TLS 1.2+. No new sub-processors and no models run
    inside the MCP; the reasoning happens in the connecting AI client.

endpoints:
  - name: full-platform
    url: https://app.getreprise.com/mcp/
    scope: All Reprise products (tour, injection, clone, platform)
    probed: 2026-08-13
    http_status: 401
    www_authenticate: 'Bearer resource_metadata="https://app.getreprise.com/.well-known/oauth-protected-resource/mcp", error="invalid_token"'
  - name: product-tours
    url: https://app.getreprise.com/v2/mcp/tour/
    scope: tour_* tools only
    probed: 2026-08-13
    http_status: 401
  - name: data-injection
    url: https://app.getreprise.com/v2/mcp/injection/
    scope: injection_* tools only
    probed: 2026-08-13
    http_status: 401
  - name: clones
    url: https://app.getreprise.com/v2/mcp/clone/
    scope: clone_* tools only
    probed: 2026-08-13
    http_status: 401

authentication:
  scheme: oauth2
  grant: authorization_code
  pkce: S256
  dynamic_client_registration: true
  consent: per-user consent screen; token scoped to the authorizing user
  sso: inherits the customer's existing Reprise SSO login
  read_only_scope: read_only
  authorization_server_metadata: well-known/reprise-oauth-authorization-server.json
  protected_resource_metadata: well-known/reprise-oauth-protected-resource.json
  revocation: >
    IdP-driven deprovisioning revokes MCP tokens immediately; SCIM/IdP deactivation cascades to
    access and refresh tokens and the token-verify filter checks user.is_active on every request.
    The MCP also appears in the user's authorized-apps list and can be revoked there.

