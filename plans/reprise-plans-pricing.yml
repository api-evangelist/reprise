name: Reprise Plans and Pricing
description: >
  Reprise publishes a pricing page but no priced tiers. What it states is the shape of the deal:
  a single annual platform fee plus flexible per-user licenses, with everything on one package —
  full application cloning, unlimited guided demos, unlimited AI data injection, SSO and RBAC in
  every package, analytics, and the Salesforce / HubSpot / Marketo / Google Analytics
  integrations plus custom API support. There is no self-serve checkout, no published list price
  and no tier ladder; the only call to action is Request Pricing. plan_count is therefore 0 —
  Reprise publishes zero priced plans.
