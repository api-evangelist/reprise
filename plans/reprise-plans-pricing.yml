  note: The one package Reprise names on its pricing page. No price is attached to it.
  included:
    - Full application cloning — realistic sandbox environments, zero risk to production
    - Unlimited guided demos with no-code text, image and UI editing
    - Unlimited AI data injection in cloned or live environments
    - SOC 2 Type II and ISO 27001 certification
    - SSO and RBAC in every package
    - Delivery via a dedicated global CDN
    - Analytics by user, session and account, with lead and buyer-intent capture
    - Marketo, HubSpot, Salesforce and Google Analytics integrations
    - Custom API support
    - Offline mode, custom themes and styling, hotspots and pulses, multi-chapter demos, embedded video and audio
    - Reusable variables, demo templates and global find-and-replace
    - Builder Community, Training Academy and Certification Program
    - Dedicated account team

licensing:
  tiers:
    - tier: Builder
      description: Can build demos, including through the Reprise MCP
    - tier: Presenter
      description: Can launch and present demos built by others; Presenter-level actions only via the MCP
  note: >
    Reprise states the MCP requires no new license — it uses the existing Reprise license, and a
    user with no Reprise license cannot use it at all.
  source: https://reprise.zendesk.com/hc/en-us/articles/50081170817691-The-Reprise-MCP-Meet-your-AI-Demo-Engineer

api_entitlement:
  note: >
    Both analytics Data APIs are gated on subscription — Reprise's own help centre opens each API
    article with "If included in your subscription". The Clone Environment token is issued by a
    CSM rather than self-service.
  source: https://reprise.zendesk.com/hc/en-us/articles/28931374746907-Clone-Environment-Data-API

