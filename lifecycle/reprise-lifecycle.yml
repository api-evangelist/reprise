versioning:
  scheme: uri-path
  current: v2
  applies_to: reprise:mcp
  docs: https://reprise.zendesk.com/hc/en-us/articles/50081170817691-The-Reprise-MCP-Meet-your-AI-Demo-Engineer
  detail: >
    The Reprise MCP surface is versioned in the path. The current atomic surface exposes
    per-action tools (tour_dom_text_edit, injection_dataset_create) and lives under /v2/mcp/ with
    product-scoped children (/v2/mcp/tour/, /v2/mcp/injection/, /v2/mcp/clone/). The unversioned
    /mcp/ path serves the full-platform catalog.
  data_apis:
    scheme: none
    detail: >
      Neither analytics Data API carries a version segment. Endpoint identity is the pipe name —
      replay_session_activity for HTML Environment, api_replicate_analytics for Clone
      Environment — plus a per-portal token.

deprecation:
  policy_url: null
  sunset_header: unknown
  detail: >
    Reprise publishes no written deprecation or sunset policy and no Deprecation/Sunset header
    contract. One superseded surface is documented in passing: the legacy polymorphic MCP tool
    set (single tools such as tour_edit, tour_capture, tour_lifecycle, injection_widget and
    html_*) has been replaced by the atomic v2 tools, and Reprise's own router skill instructs a
    client that still sees the polymorphic names to reconnect to the current endpoint. That is a
    migration instruction, not a dated deprecation policy, so no Deprecation pointer is emitted.
  superseded_surfaces:
    - name: Reprise MCP legacy polymorphic tool surface
      replaced_by: atomic per-action tools under /v2/mcp/
      source: skills/reprise-mcp.md

