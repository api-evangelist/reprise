apis:
  - aid: reprise:mcp
    name: Reprise MCP Server
    description: >
      The Reprise MCP server is a remote Model Context Protocol endpoint that lets any
      MCP-compatible AI assistant — Claude, ChatGPT, Codex, Microsoft Copilot, Gemini, Cursor —
      drive the whole Reprise platform. It exposes more than 100 atomic demo-authoring tools
      across three product surfaces: tour_* (61 tools for capture, DOM text and attribute
      editing, guides, variables and links), injection_* (21 tools for datasets, sources and
      adapters), clone_* (snippets, requests, debug and publish) and nine cross-product
      platform_* tools (platform_whoami, platform_summary_report, platform_friction_report,
      platform_folder_*, platform_asset_move). Authentication is OAuth 2.0 authorization code
      with PKCE S256 against the customer's existing Reprise SSO login, with Dynamic Client
      Registration supported; tokens inherit the authorizing user's Reprise role and a
      read-only token scope is available. Product-scoped endpoints expose a smaller tool
      catalog for clients that cap tool counts.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.reprise.com/platform/mcp
    baseURL: https://app.getreprise.com/mcp/
    tags:
      - Model Context Protocol
      - Agent Tooling
      - Demo Authoring
      - OAuth
    properties:
      - type: MCPServer
        url: mcp/reprise-mcp.yml
      - type: Documentation
        url: https://reprise.zendesk.com/hc/en-us/articles/50081170817691-The-Reprise-MCP-Meet-your-AI-Demo-Engineer
      - type: Authentication
        url: authentication/reprise-authentication.yml
      - type: OAuthScopes
        url: scopes/reprise-scopes.yml
    contact:
      - FN: Reprise Support
        email: support@reprise.com
        url: https://www.reprise.com/contact

  - aid: reprise:data-api
    name: Reprise Clone Environment Data API
    description: >
      The Clone Environment Data API returns viewer session analytics for published Reprise
      Clone Environment demos as a single JSON pipe (api_replicate_analytics). The response
      carries a meta block of column names and types followed by a data array of session
      records: shard_name, client_id, demo_title, demo_published_date, session_date and
      viewer (the welcome-screen email address when one is used, otherwise the viewer IP).
      Authentication is a token issued by the customer's Reprise CSM, passed as a token query
      parameter. start_timestamp is required and end_timestamp is optional; responses are
      capped at 100MB per call, so Reprise recommends pulling narrow time windows on a
      schedule rather than a single large backfill.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://reprise.zendesk.com/hc/en-us/articles/28931374746907-Clone-Environment-Data-API
    baseURL: https://api.us-east.tinybird.co
    tags:
      - Demo Analytics
      - Data Export
      - Engagement Tracking
      - Sales Intelligence
    properties:
      - type: Documentation
        url: https://reprise.zendesk.com/hc/en-us/articles/28931374746907-Clone-Environment-Data-API
      - type: APIReference
        url: https://reprise.zendesk.com/hc/en-us/articles/28931374746907-Clone-Environment-Data-API
      - type: RateLimits
        url: rate-limits/reprise-rate-limits.yml
    contact:
      - FN: Reprise Support
        email: support@reprise.com
        url: https://www.reprise.com/contact

  - aid: reprise:html-environment-data-api
    name: Reprise HTML Environment Data API
    description: >
      The HTML Environment Data API returns click-level viewer activity for published Reprise
      HTML Environment (Product Tour) demos through a single endpoint, replay_session_activity.
      Each record describes one activity event inside a demo session — snapshot_id and
      snapshot_title for the screen viewed, guide_id, guide_step_number, guide_text and
      guide_trigger for the guide shown, button_text and button_action for the interaction,
      plus session, visitor (name and email captured on the welcome screen), link and published
      or draft replay identifiers. Authentication is a token created in the Reprise portal
      under Settings → API Management; the full endpoint URL, including the portal ID, is
      copied from the demo's Copy API Endpoint menu. start_timestamp and end_timestamp scope
      the window in UTC, an optional visitor_company=1 parameter adds the viewer-entered
      company name, and responses are capped at 100MB.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://reprise.zendesk.com/hc/en-us/articles/18940321925659-HTML-Environment-Data-API
    baseURL: https://api.us-east.tinybird.co
    tags:
      - Demo Analytics
      - Data Export
      - Engagement Tracking
      - Session Activity
    properties:
      - type: Documentation
        url: https://reprise.zendesk.com/hc/en-us/articles/18940321925659-HTML-Environment-Data-API
      - type: APIReference
        url: https://reprise.zendesk.com/hc/en-us/articles/18940321925659-HTML-Environment-Data-API
      - type: Examples
        url: https://reprise.zendesk.com/hc/en-us/articles/19639380651547-API-Example-Queries
      - type: RateLimits
        url: rate-limits/reprise-rate-limits.yml
    contact:
      - FN: Reprise Support
        email: support@reprise.com
        url: https://www.reprise.com/contact

