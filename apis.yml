aid: reprise
name: Reprise
description: >
  Reprise is the enterprise demo creation platform sales, presales and marketing teams use to
  build no-code interactive product demos — guided Product Tours captured from a live front end,
  Data Injection that overlays prospect-specific data on a real application, and full Clone
  Environments that reproduce an application down to the code. Reprise ships a remote Model
  Context Protocol server at app.getreprise.com that exposes more than 100 atomic demo-authoring
  tools to any MCP client (Claude, ChatGPT, Copilot, Gemini, Codex) over OAuth 2.0 authorization
  code with PKCE, plus two token-authenticated analytics Data APIs (HTML Environment
  replay_session_activity and Clone Environment api_replicate_analytics) for pulling click-level
  demo engagement data into a warehouse. Reprise is SOC 2 Type 2 and ISO/IEC 27001:2022 certified,
  with SSO and RBAC in every package, and has served over 20 million demos for customers including
  Databricks, ServiceNow, Cloudera, 1Password, Commvault and iCIMS.
